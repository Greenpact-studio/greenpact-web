# Publication du site statique sur OVH.
# Déclencheurs : chaque push sur main, un bouton manuel, et toutes les 6 h
# (pour rafraîchir les épisodes du podcast lus dans le flux RSS au build).
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   OVH_FTP_SERVER    ex. ftp.cluster0xx.hosting.ovh.net
#   OVH_FTP_USERNAME  identifiant FTP OVH
#   OVH_FTP_PASSWORD  mot de passe FTP OVH
#
# Les serveurs FTP d'OVH n'acceptent pas le FTPS explicite (« 500 This security
# scheme is not implemented »). On tente donc d'abord le SFTP (port 22, mêmes
# identifiants, disponible sur les offres Pro et Performance), puis, en repli,
# le FTP simple (offre Perso) — dans ce cas le mot de passe transite en clair.
name: Déployer sur OVH

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Envoi SFTP vers /www/ (chiffré)
        id: sftp
        continue-on-error: true
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          port: 22
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          local_path: "./out/*"
          # En SFTP, OVH ouvre la session dans le dossier personnel : www est relatif.
          remote_path: "./www"
          sftp_only: true
          # Rien n'est supprimé côté serveur : les fichiers WordPress restent,
          # seul index.html (et les nouveaux fichiers) sont écrasés/ajoutés.
          delete_remote_files: false

      - name: Envoi FTP simple vers /www/ (repli si SFTP indisponible)
        if: steps.sftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./out/
          server-dir: /www/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
